<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login • MoodPulse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body class="theme-calm auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-emoji">😊</span>
        <h1>MoodPulse</h1>
        <p>Live Face Mood Reader & Adaptive Workspace</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username"
                 required minlength="3" autocomplete="username" autofocus />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password"
                 required minlength="6" autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="/signup">Create one</a></p>
      </div>
    </div>
  </div>

</body>
</html>
