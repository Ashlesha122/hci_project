<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodPulse • Work Companion</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="theme-calm">
  <header class="panel-header">
    <div class="brand">
      <span class="brand-icon">😊</span>
      <div>
        <h1>MoodPulse</h1>
        <p>Live Work &amp; Well-Being Companion</p>
      </div>
    </div>
    <div class="sync-pill" id="profile-sync-pill" title="Synced with your MoodPulse web account">
      <span class="sync-status-dot"></span>
      <span id="sync-username">Synced: Ashlesha</span>
    </div>
  </header>

  <div class="video-section">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div id="placeholder" class="placeholder">Camera is off</div>
      <span id="live-pill" class="live-pill" hidden>Live</span>
    </div>
    <div class="actions">
      <button type="button" id="start-btn" class="btn btn-primary">Start Check-in</button>
      <button type="button" id="stop-btn" class="btn btn-secondary" hidden>Pause</button>
    </div>
    <p id="status" class="status-text">Ready to connect to local app...</p>
  </div>

  <!-- Primary Emotion Card -->
  <div id="result" class="result-card" hidden>
    <span id="emoji" class="emoji">🌿</span>
    <div class="result-details">
      <div id="label" class="label">Calm &amp; Centered</div>
      <div id="sub" class="sub">95% Match</div>
      <p id="guidance" class="guidance-text"></p>
    </div>
  </div>

  <!-- Automatic Background Recording Card (Zero User Disruption) -->
  <div class="recording-badge-card" id="recording-card" hidden>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="rec-dot"></span>
        <span style="font-weight: 700; font-size: 11px; color: #047857;">Auto-Recording Active</span>
      </div>
      <span id="saved-counter-badge" style="background: #d1fae5; color: #065f46; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;">0 saved</span>
    </div>
    <p style="font-size: 11px; color: #065f46; margin-top: 4px; line-height: 1.35;">
      Silently recording your mood while you work. No manual clicks needed!
    </p>
  </div>

  <!-- Box Breathing Reset -->
  <div class="breathing-mini-card">
    <div class="breathing-header">
      <span class="b-title">🧘 60s Breathing Reset</span>
      <button type="button" id="b-pacer-btn" class="btn-sm btn-outline">Start</button>
    </div>
    <div id="b-pacer-body" class="breathing-body" hidden>
      <div class="b-circle" id="b-circle">
        <span id="b-action">Inhale</span>
        <span id="b-counter">4s</span>
      </div>
    </div>
  </div>

  <!-- Open Full Timeline Shortcut -->
  <div style="margin-top: 10px; text-align: center;">
    <button type="button" id="open-timeline-btn" class="btn btn-outline" style="width: 100%; font-size: 11px; padding: 6px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
      📊 View Full Mood Timeline in App
    </button>
  </div>

  <!-- Server Settings Footer (for remote/LAN devices) -->
  <footer class="panel-footer" style="margin-top: 14px; padding: 10px 4px; font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border);">
    <span id="server-status-pill" style="color: #059669; font-weight: 600;">● Connected</span>
    <button type="button" id="server-settings-btn" class="btn-sm btn-outline" style="font-size: 10px; padding: 2px 8px; cursor: pointer;">⚙️ Server URL</button>
  </footer>
  <div id="server-settings-box" style="display: none; padding: 10px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; font-size: 12px;">
    <label style="display: block; margin-bottom: 4px; font-weight: 600;">Server Address:</label>
    <div style="display: flex; gap: 6px;">
      <input type="text" id="server-url-input" placeholder="http://192.168.1.5:5000" style="flex: 1; padding: 4px 8px; font-size: 11px; border: 1px solid var(--border); border-radius: 4px;" />
      <button type="button" id="save-server-btn" class="btn-sm btn-primary" style="padding: 4px 8px; cursor: pointer;">Save</button>
    </div>
  </div>

  <canvas id="canvas" hidden></canvas>
  <script src="panel.js"></script>
</body>
</html>
